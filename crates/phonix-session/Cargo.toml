[package]
name = "phonix-session"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "The serialisable shape of a sequencer session: tracks, patterns, the mixer, tempo, the mod matrix"
keywords = ["audio", "sequencer", "daw", "session", "serde"]
categories = ["multimedia::audio"]
repository = "https://github.com/phonix-audio/phonix"

[dependencies]
phonix-music = { path = "../phonix-music" }
phonix-fx = { path = "../phonix-fx" }
phonix-legacy = { path = "../phonix-legacy" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
