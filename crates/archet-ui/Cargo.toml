[package]
name        = "archet-ui"
description = "egui editor for the Archet engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
archet      = { workspace = true }
egui        = { workspace = true }
egui_extras = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
phonix-ui    = { workspace = true }   # icons, colors, widgets, keyboard, ui_spec, preset picker/io
phonix-fx     = { workspace = true }
phonix-rt     = { workspace = true }   # the lock-free meter channel
phonix-plugin = { workspace = true }   # the `Preset` trait the picker reads

# No `rfd` / `directories` here, and no `[features]` table. This editor has no
# file dialog of its own: its Save/Load buttons call `phonix_ui::preset_io`, and
# `phonix-ui` declares both crates unconditionally. Declaring them again would
# say something false about this crate and would not change the resolved graph.

[dev-dependencies]
# The editor is judged by eye, so its tests render it: `snapshot` writes PNG
# baselines under tests/snapshots and diffs against them, through software
# Vulkan (lavapipe), no GPU required.
egui_kittest = { workspace = true }

# `rfd` reaches wayland through `ashpd`, and without the `dlopen` feature that
# crate's build script demands libwayland-client's pkg-config file at COMPILE
# time, for a library nothing here calls directly. `phonix-ui` pulls rfd in, so
# the shim is needed even though the dialogs are not this crate's.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }
