[package]
name        = "archet"
description = "Archet — a bowed-string physical model (violin / viola / cello / double bass) with a procedural modal body, plus a plucked harpsichord voice."
readme      = "../../README.md"
keywords    = ["audio", "dsp", "synthesis"]
categories  = ["multimedia::audio"]
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
# Deliberately not a cdylib: the plugin crate is the shared object.
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
# Opt into the shared crates this engine actually needs; the paths live in the
# workspace manifest so the SDK switch is one edit there, never here.
phonix-dsp    = { workspace = true }   # filters::BiquadT — the modal body's biquad
phonix-rt     = { workspace = true }   # the lock-free meter channel
phonix-preset = { workspace = true }   # the `Preset` trait ArchetPatch implements

# There is no [features] table, and the absence is the contract. Cargo unifies
# features across a resolved graph, so an optional `egui` here would be switched
# on for the engine's OWN tests by any `cargo test --workspace`. Keeping the
# editor in a separate crate is what makes "the engine never sees egui" true
# rather than merely intended. Guard it:
#   cargo tree -p archet --edges normal | grep -qE '^(egui|eframe|winit|wgpu)' && exit 1

[dev-dependencies]
serde_json = { workspace = true }
