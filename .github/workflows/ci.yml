# Builds, tests and bundles the plugin on Linux and Windows when a version tag
# is pushed, and publishes the pair as the release of that tag, with the
# changelog section of the version as its notes. Nothing runs on a push to a
# branch or on a pull request. Nothing here needs a secret: every crate the
# plugin builds from is in this repository or on crates.io.
name: ci

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch_dir: x86_64-linux
            lib: libarchet_plugin.so
            vst3_ext: so
          - os: windows-latest
            platform: windows
            arch_dir: x86_64-win
            lib: archet_plugin.dll
            vst3_ext: vst3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Reads rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            cargo test --release --workspace
          else
            cargo test --release -p archet-plugin -p archet-ui
          fi

      - name: Build the plugin
        run: cargo build --release -p archet-plugin

      # Layout per the VST3 spec: <Name>.vst3/Contents/<arch>/<Name>.<ext>.
      # A CLAP is the same shared object under a .clap name.
      - name: Bundle
        shell: bash
        run: |
          NAME=$(python3 -c 'import re;print(re.search(r"^name\s*=\s*\"([^\"]+)\"", open("bundler.toml").read(), re.M).group(1))')
          OUT="dist/${{ matrix.platform }}"
          DEST="$OUT/$NAME.vst3/Contents/${{ matrix.arch_dir }}"
          mkdir -p "$DEST"
          cp "target/release/${{ matrix.lib }}" "$DEST/$NAME.${{ matrix.vst3_ext }}"
          cp "target/release/${{ matrix.lib }}" "$OUT/$NAME.clap"
          cd "$OUT" && 7z a -tzip "../$NAME-${{ matrix.platform }}-x86_64.zip" . > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The notes are the changelog section of the tagged version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file notes.md
