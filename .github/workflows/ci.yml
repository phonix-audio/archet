# Builds, tests and bundles the plugin on Linux and Windows, and hands the pair
# out as a rolling `nightly` prerelease. There are no version tags and no
# versioned releases: what is published is the head of main, built. Nothing
# here needs a secret: every crate the plugin builds from is in this repository
# or on crates.io.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch_dir: x86_64-linux
            lib: libarchet_plugin.so
            vst3_ext: so
          - os: windows-latest
            platform: windows
            arch_dir: x86_64-win
            lib: archet_plugin.dll
            vst3_ext: vst3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Reads rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            cargo test --release --workspace
          else
            cargo test --release -p archet-plugin -p archet-ui
          fi

      - name: Build the plugin
        run: cargo build --release -p archet-plugin

      # Layout per the VST3 spec: <Name>.vst3/Contents/<arch>/<Name>.<ext>.
      # A CLAP is the same shared object under a .clap name.
      - name: Bundle
        shell: bash
        run: |
          NAME=$(python3 -c 'import re;print(re.search(r"^name\s*=\s*\"([^\"]+)\"", open("bundler.toml").read(), re.M).group(1))')
          OUT="dist/${{ matrix.platform }}"
          DEST="$OUT/$NAME.vst3/Contents/${{ matrix.arch_dir }}"
          mkdir -p "$DEST"
          cp "target/release/${{ matrix.lib }}" "$DEST/$NAME.${{ matrix.vst3_ext }}"
          cp "target/release/${{ matrix.lib }}" "$OUT/$NAME.clap"
          cd "$OUT" && 7z a -tzip "../$NAME-${{ matrix.platform }}-x86_64.zip" . > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip

  nightly:
    # Main only, and never a pull request: a fork must not be able to move what
    # the nightly link hands people.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One rolling prerelease, moved to the commit it was built from, so the
      # download link never changes and never names a version that does not
      # exist. Deleted and recreated rather than edited: `gh release upload
      # --clobber` leaves an asset behind when a platform's name changes.
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "nightly" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "The head of main, bundled on $(date -u +%Y-%m-%d) from ${GITHUB_SHA:0:7}. Unsigned, and not a release."
