[package]
name = "phonix-fx"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "The effects contract: the Effect trait, self-describing parameter specs, chains and their serialisable description; every effect behind a feature"
keywords = ["audio", "effects", "reverb", "delay", "vst"]
categories = ["multimedia::audio"]
repository = "https://github.com/phonix-audio/phonix-sdk"

[features]
default = []
# One feature per effect kind. A consumer names what it ships.
parametric-eq = ["dep:phonix-dsp"]
compressor = []
reverb = []
brickwall-limiter = []
delay = []
stereo-imager = []
# Partitioned-block FFT convolution, and the impulse responses it runs. Its
# own feature because it is the only thing here that wants an FFT.
convolution = ["dep:rustfft"]
# A bucket-brigade chorus, wrapping the shared delay-line primitive.
chorus = ["dep:phonix-dsp"]
# Families.
eq = ["parametric-eq"]
dynamics = ["compressor", "brickwall-limiter"]
reverbs = ["reverb", "convolution"]
delays = ["delay"]
spatial = ["stereo-imager", "chorus"]
full = ["eq", "dynamics", "reverbs", "delays", "spatial"]

[dependencies]
phonix-dsp = { path = "../phonix-dsp", optional = true }
rustfft = { version = "6.2", optional = true }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
