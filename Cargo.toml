[workspace]
resolver = "2"
exclude = ["vendor/phonix-sdk"]
members = [
    "crates/archet",
    "crates/archet-ui",
    "crates/archet-plugin",
]

# One place for everything the three crates share. `repository` in particular:
# when these repositories move to a dedicated organisation, this is the single
# line that changes.
[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT OR Apache-2.0"
authors    = ["Cyril Bonté"]
repository = "https://github.com/phonix-audio/archet"

[workspace.dependencies]
archet    = { path = "crates/archet",    version = "0.1.0" }
archet-ui = { path = "crates/archet-ui", version = "0.1.0" }

# phonix-sdk, mirrored under vendor/ as a squashed subtree so a clone of this
# repository alone builds. `git subtree pull --prefix vendor/phonix-sdk <sdk>
# <tag> --squash` moves it; nothing under vendor/ is edited here. Members opt
# in with `phonix-dsp = { workspace = true }`; the ones this plugin does not
# use simply stay unreferenced.
phonix-dsp    = { path = "vendor/phonix-sdk/crates/phonix-dsp" }
phonix-fx     = { path = "vendor/phonix-sdk/crates/phonix-fx" }
phonix-music  = { path = "vendor/phonix-sdk/crates/phonix-music" }
phonix-plugin = { path = "vendor/phonix-sdk/crates/phonix-plugin" }
phonix-rt     = { path = "vendor/phonix-sdk/crates/phonix-rt" }
phonix-ui     = { path = "vendor/phonix-sdk/crates/phonix-ui" }

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The editor speaks plain `egui`, never `eframe`. `eframe::egui` is only a
# re-export, so dropping eframe takes glow, winit, x11 and wayland out of the
# graph with it, and the Windows cross-build stops having to dodge the
# Linux-only backend features the sequencer carries.
egui        = "0.34"
egui_extras = { version = "0.34", features = ["all_loaders"] }
# Every declarative editor's spec tests parse the baked `.ron` themselves.
ron         = "0.12"
rfd         = "0.15"
directories = "5.0"

# Headless egui harness: AccessKit queries for behaviour, software-Vulkan
# rendering (lavapipe) for image snapshots. Version must track egui.
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }

nice-plug      = { git = "https://codeberg.org/RustAudio/nice-plug.git", rev = "ea25d719f252d683cb39ffa05d9eabcc6dbb768c" }
nice-plug-egui = { git = "https://codeberg.org/RustAudio/nice-plug.git", rev = "ea25d719f252d683cb39ffa05d9eabcc6dbb768c" }

[profile.dev]
opt-level   = 2
incremental = true
debug       = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 16
strip         = "symbols"
